      icon: ICONS[i % ICONS.length],
      tint: TINTS[i % TINTS.length],
    }));

    let orderSuccess = false;
    let toastTimer = null;
    let selectedQty = 1;

    const params = new URLSearchParams(window.location.search);
    const requestedId = Number(params.get('id'));
    const currentProduct = PRODUCTS.find((p) => p.id === requestedId) || PRODUCTS[0];

    // ---------- Вспомогательные функции ----------
    function formatPrice(v) { return v.toLocaleString('ru-RU') + ' ₸'; }
    function pluralizeRu(n, forms) {
      const mod10 = n % 10, mod100 = n % 100;
      if (mod10 === 1 && mod100 !== 11) return forms[0];
      if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
      return forms[2];
    }
    function totalItems() { return cart.reduce((s, i) => s + i.qty, 0); }
    function totalPrice() { return cart.reduce((s, i) => s + i.qty * i.price, 0); }
    function findCartItem(id) { return cart.find((i) => i.id === id); }

        <span class="text-brand">${currentProduct.name}</span>`;

                  ${f}
                </li>`).join('')}

            <div class="flex items-center gap-3 mb-6">
              <div class="flex items-center gap-3 border-[1.5px] border-gray-200 rounded-full px-2 py-1.5">
                <button id="qty-dec" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1.5 transition"><i data-lucide="minus" style="width:16px;height:16px"></i></button>
                <span id="qty-value" class="font-extrabold w-5 text-center">${selectedQty}</span>
                <button id="qty-inc" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1.5 transition"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
              </div>

              <button id="add-to-cart-btn" class="flex-1 bg-brand text-white py-3.5 rounded-full font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition">
                <i data-lucide="shopping-bag" style="width:18px;height:18px"></i>
                В корзину
              </button>
            </div>

            <div class="grid grid-cols-3 gap-2 mb-8">
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="truck" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">Доставка за 1–2 дня</span>
              </div>
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="shield-check" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">Оригинальный товар</span>
              </div>
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="credit-card" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">Оплата картой / наличными</span>
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <details class="accordion border-b border-gray-100 py-3" open>
                <summary class="flex items-center justify-between font-bold text-brand text-sm">
                  Описание
                  <i data-lucide="chevron-right" class="chevron" style="width:16px;height:16px"></i>
                </summary>
                <p class="text-gray-600 text-sm font-medium mt-3">${p.description}</p>
              </details>

              <details class="accordion border-b border-gray-100 py-3">
                <summary class="flex items-center justify-between font-bold text-brand text-sm">
                  Способ применения
                  <i data-lucide="chevron-right" class="chevron" style="width:16px;height:16px"></i>
                </summary>
                <p class="text-gray-600 text-sm font-medium mt-3">${p.usage}</p>
              </details>

              <details class="accordion border-b border-gray-100 py-3">
                <summary class="flex items-center justify-between font-bold text-brand text-sm">
                  Доставка и оплата
                  <i data-lucide="chevron-right" class="chevron" style="width:16px;height:16px"></i>
                </summary>
                <p class="text-gray-600 text-sm font-medium mt-3">Доставка по Алматы — 1–2 рабочих дня, по Казахстану — 2–5 дней. Оплата картой онлайн или наличными курьеру при получении.</p>
              </details>
            </div>
          </div>
        </div>`;

      lucide.createIcons();
    }

    // ---------- Похожие товары ----------
    function renderRelated() {
      const related = PRODUCTS
        .filter((p) => p.id !== currentProduct.id && p.category === currentProduct.category)
        .slice(0, 4);

      const fallback = PRODUCTS.filter((p) => p.id !== currentProduct.id && !related.includes(p)).slice(0, 4 - related.length);
      const list = [...related, ...fallback].slice(0, 4);

      document.getElementById('related-grid').innerHTML = list.map((p) => `
        <div class="bg-white rounded-3xl p-3.5 sm:p-4 shadow-sm hover:shadow-xl border border-gray-100 flex flex-col transition-all duration-300 hover:-translate-y-1">
          <a href="product.html?id=${p.id}" class="block">
            <div class="relative aspect-square rounded-2xl ${p.tint} flex items-center justify-center overflow-hidden">
              <i data-lucide="${p.icon}" class="text-brand opacity-80" style="width:40px;height:40px;stroke-width:1.3"></i>
            </div>
            <h3 class="font-extrabold text-brand text-xs sm:text-sm mt-3 leading-snug hover:underline">${p.name}</h3>
          </a>
          <div class="flex items-center justify-between mt-2">
            <span class="font-extrabold text-gray-900 text-xs sm:text-sm">${formatPrice(p.price)}</span>
          </div>
          <button data-action="add" data-id="${p.id}" class="bg-brand text-white mt-2.5 w-full py-2 rounded-full font-bold text-xs flex items-center justify-center gap-1.5 hover:opacity-90 active:scale-95 transition">
            <i data-lucide="shopping-bag" style="width:13px;height:13px"></i>
            В корзину
          </button>
        </div>`).join('');

      lucide.createIcons();
    }

    // ---------- Корзина ----------
    function addToCart(id, qty) {
      const product = PRODUCTS.find((p) => p.id === id);
      const existing = findCartItem(id);
      if (existing) existing.qty += qty;
      else cart.push({ ...product, qty });
      bumpBadge();
      showToast(`«${product.name}» добавлен в корзину`);
      renderCartBody();
      renderBadge();
    }
    function incCartQty(id) { findCartItem(id).qty += 1; renderCartBody(); renderBadge(); }
    function decCartQty(id) {
      const item = findCartItem(id);
      item.qty -= 1;
      if (item.qty <= 0) cart = cart.filter((i) => i.id !== id);
      renderCartBody(); renderBadge();
    }
    function removeCartItem(id) { cart = cart.filter((i) => i.id !== id); renderCartBody(); renderBadge(); }

    function renderBadge() {
      const badge = document.getElementById('cart-badge');
      const count = totalItems();
      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
      else badge.classList.add('hidden');
    }
    function bumpBadge() {
      const badge = document.getElementById('cart-badge');
      badge.classList.remove('badge-bump');
      void badge.offsetWidth;
      badge.classList.add('badge-bump');
    }

    function renderCartBody() {
      const body = document.getElementById('cart-body');
      const title = document.getElementById('cart-title');
      const count = totalItems();
      title.textContent = count > 0 ? `Корзина · ${count} ${pluralizeRu(count, ['товар', 'товара', 'товаров'])}` : 'Корзина';

      if (orderSuccess) {
        body.innerHTML = `
          <div class="flex flex-col items-center justify-center text-center h-full py-16">
            <i data-lucide="check-circle-2" class="text-brand mb-4" style="width:56px;height:56px;stroke-width:1.4"></i>
            <h3 class="font-extrabold text-brand text-lg mb-2">Заказ оформлен!</h3>
            <p class="text-gray-500 text-sm font-medium max-w-xs mb-6">Наш менеджер свяжется с вами в течение 15 минут, чтобы подтвердить заказ и уточнить детали доставки.</p>
            <button id="continue-shopping" class="bg-white text-brand border-[1.5px] border-brand px-6 py-2.5 rounded-full font-bold text-sm hover:bg-brand/5 transition">Продолжить покупки</button>
          </div>`;
      } else if (cart.length === 0) {
        body.innerHTML = `
          <div class="flex flex-col items-center justify-center text-center h-full py-16">
            <i data-lucide="shopping-bag" class="text-brand opacity-40 mb-4" style="width:48px;height:48px;stroke-width:1.3"></i>
            <h3 class="font-extrabold text-gray-700 mb-1.5">Ваша корзина пуста</h3>
            <p class="text-gray-400 text-sm font-medium max-w-xs">Добавьте товары из каталога, чтобы оформить заказ</p>
          </div>`;
      } else {
        const itemsHTML = cart.map((item) => `
          <li class="flex items-center gap-3 py-3.5 border-b border-gray-100">
            <div class="w-16 h-16 rounded-2xl ${item.tint} flex items-center justify-center flex-shrink-0">
              <i data-lucide="${item.icon}" class="text-brand" style="width:24px;height:24px;stroke-width:1.4"></i>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-bold text-brand text-sm leading-snug truncate">${item.name}</p>
              <p class="text-gray-400 text-xs font-semibold mt-0.5">${formatPrice(item.price)}</p>
              <div class="flex items-center gap-2 mt-2 border border-gray-200 rounded-full w-fit px-1">
                <button data-action="dec" data-id="${item.id}" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1 transition"><i data-lucide="minus" style="width:14px;height:14px"></i></button>
                <span class="text-xs font-extrabold w-4 text-center">${item.qty}</span>
                <button data-action="inc" data-id="${item.id}" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1 transition"><i data-lucide="plus" style="width:14px;height:14px"></i></button>
              </div>
            </div>
            <button data-action="remove" data-id="${item.id}" class="text-gray-400 hover:text-red-500 rounded-full p-2 self-start transition"><i data-lucide="trash-2" style="width:16px;height:16px"></i></button>
          </li>`).join('');

        body.innerHTML = `
          <ul class="py-2">${itemsHTML}</ul>
          <div class="flex items-center justify-between py-4">
            <span class="font-bold text-gray-500">Итого</span>
            <span class="font-extrabold text-brand text-xl">${formatPrice(totalPrice())}</span>
          </div>
          <div class="border-t border-gray-100 pt-5 pb-8">
            <h3 class="font-extrabold text-brand mb-4">Оформление заказа</h3>
            <form id="order-form" class="flex flex-col gap-3">
              <label class="block">
                <span class="text-xs font-bold text-gray-500 mb-1.5 block">Имя</span>
                <div class="relative">
                  <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" style="width:16px;height:16px"></i>
                  <input required type="text" name="name" placeholder="Например, Айгерим" class="w-full rounded-2xl border-[1.5px] border-gray-200 pl-10 pr-4 py-3 text-sm font-medium outline-none focus:border-brand transition" />
                </div>
              </label>
              <label class="block">
                <span class="text-xs font-bold text-gray-500 mb-1.5 block">Номер телефона</span>
                <div class="relative">
                  <i data-lucide="phone" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" style="width:16px;height:16px"></i>
                  <input required type="tel" name="phone" placeholder="+7 (___) ___-__-__" class="w-full rounded-2xl border-[1.5px] border-gray-200 pl-10 pr-4 py-3 text-sm font-medium outline-none focus:border-brand transition" />
                </div>
              </label>
              <label class="block">
                <span class="text-xs font-bold text-gray-500 mb-1.5 block">Адрес доставки</span>
                <div class="relative">
                  <i data-lucide="map-pin" class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400" style="width:16px;height:16px"></i>
                  <input required type="text" name="address" placeholder="Город, улица, дом, квартира" class="w-full rounded-2xl border-[1.5px] border-gray-200 pl-10 pr-4 py-3 text-sm font-medium outline-none focus:border-brand transition" />
                </div>
              </label>
              <button type="submit" class="bg-brand text-white w-full py-3.5 rounded-full font-extrabold text-sm mt-2 hover:opacity-90 active:scale-95 transition">Оформить заказ</button>
            </form>
          </div>`;
      }
      lucide.createIcons();
    }

    function openCart() {
      document.getElementById('cart-overlay').classList.remove('opacity-0', 'pointer-events-none');
      document.getElementById('cart-overlay').classList.add('opacity-100', 'pointer-events-auto');
      document.getElementById('cart-drawer').classList.remove('translate-x-full');
      document.getElementById('cart-drawer').classList.add('translate-x-0');
      document.body.classList.add('overflow-hidden');
    }
    function closeCart() {
      document.getElementById('cart-overlay').classList.add('opacity-0', 'pointer-events-none');
      document.getElementById('cart-overlay').classList.remove('opacity-100', 'pointer-events-auto');
      document.getElementById('cart-drawer').classList.add('translate-x-full');
      document.getElementById('cart-drawer').classList.remove('translate-x-0');
      document.body.classList.remove('overflow-hidden');
      setTimeout(() => { orderSuccess = false; renderCartBody(); }, 300);
    }

    function showToast(text) {
      const container = document.getElementById('toast-container');
      container.innerHTML = `
        <div class="bg-brand text-white flex items-center gap-2 px-5 py-3 rounded-full shadow-2xl text-sm font-bold whitespace-nowrap toast-anim">
          <i data-lucide="check-circle-2" style="width:17px;height:17px"></i>
          ${text}
        </div>`;
      lucide.createIcons();
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { container.innerHTML = ''; }, 2200);
    }

    // ---------- События ----------
    document.addEventListener('click', (e) => {
      if (e.target.closest('#qty-inc')) {
        selectedQty += 1;
        document.getElementById('qty-value').textContent = selectedQty;
        return;
      }
      if (e.target.closest('#qty-dec')) {
        selectedQty = Math.max(1, selectedQty - 1);
        document.getElementById('qty-value').textContent = selectedQty;
        return;
      }
      if (e.target.closest('#add-to-cart-btn')) {
        addToCart(currentProduct.id, selectedQty);
        selectedQty = 1;
        document.getElementById('qty-value').textContent = selectedQty;
        return;
      }

      const actionBtn = e.target.closest('[data-action]');
      if (actionBtn) {
        const id = Number(actionBtn.dataset.id);
        const action = actionBtn.dataset.action;
        if (action === 'add') addToCart(id, 1);
        if (action === 'inc') incCartQty(id);
        if (action === 'dec') decCartQty(id);
        if (action === 'remove') removeCartItem(id);
        return;
      }

      if (e.target.closest('#cart-btn')) { openCart(); return; }
      if (e.target.closest('#cart-close')) { closeCart(); return; }
      if (e.target.id === 'cart-overlay') { closeCart(); return; }
      if (e.target.closest('#continue-shopping')) { closeCart(); return; }

      if (e.target.closest('#menu-btn')) {
        document.getElementById('mobile-nav').classList.toggle('hidden');
        document.getElementById('mobile-nav').classList.toggle('flex');
      }
    });

    document.addEventListener('submit', (e) => {
      if (e.target.id === 'order-form') {
        e.preventDefault();
        if (cart.length === 0) return;
        orderSuccess = true;
        cart = [];
        renderCartBody();
        renderBadge();
      }
    });

    // ---------- Инициализация ----------
    document.getElementById('footer-year').textContent = '© ' + new Date().getFullYear() + ' qqq care. Все права защищены.';
    renderBreadcrumb();
    renderProduct();
    renderRelated();
    renderCartBody();
    renderBadge();
  </script>
</body>
</html>
