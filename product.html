<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Товар — qqq care.</title>
  <meta name="description" content="Карточка товара qqq care." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#0C5740', 'brand-light': '#1a7a5a' },
          fontFamily: { sans: ['Nunito', 'sans-serif'] },
          boxShadow: { 'soft': '0 20px 40px -15px rgba(0, 0, 0, 0.08)' },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Nunito', sans-serif; }
    .blob { pointer-events: none; position: absolute; border-radius: 9999px; filter: blur(70px); }
    @keyframes slideUp { from { transform: translate(-50%, 16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    .toast-anim { animation: slideUp .3s ease; }
    .accordion summary { list-style: none; cursor: pointer; }
    .accordion summary::-webkit-details-marker { display: none; }
    .accordion summary .chevron { transition: transform .25s ease; }
    .accordion[open] summary .chevron { transform: rotate(90deg); }
  </style>
</head>

<body class="bg-white text-gray-800 antialiased">

  <!-- ==================== HEADER ==================== -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <span class="text-3xl font-black text-brand tracking-tight">qqq</span>
        <span class="bg-brand/10 text-brand px-2.5 py-1 rounded-full text-lg font-extrabold">care.</span>
      </a>

      <nav class="hidden sm:flex items-center gap-8">
        <a href="catalog.html" data-i18n="navCatalog" class="text-gray-600 hover:text-brand font-semibold text-sm transition">Каталог</a>
        <a href="about.html" data-i18n="navAbout" class="text-gray-600 hover:text-brand font-semibold text-sm transition">О бренде</a>
        <a href="contacts.html" data-i18n="navContacts" class="text-gray-600 hover:text-brand font-semibold text-sm transition">Контакты</a>
      </nav>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex items-center bg-gray-100 p-1 rounded-full">
          <button data-set-lang="ru" class="px-3 py-1 rounded-full text-xs font-extrabold bg-brand text-white transition">RU</button>
          <button data-set-lang="kz" class="px-3 py-1 rounded-full text-xs font-extrabold text-gray-500 hover:text-brand transition">KZ</button>
        </div>

        <button id="cart-btn" aria-label="Открыть заявку" class="relative text-gray-600 hover:bg-brand/10 hover:text-brand rounded-full p-2.5 transition">
          <i data-lucide="shopping-bag" style="width:22px;height:22px"></i>
          <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-brand text-white text-[11px] font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
        </button>

        <button id="menu-btn" aria-label="Открыть меню" class="sm:hidden text-gray-600 hover:bg-brand/10 hover:text-brand rounded-full p-2.5 transition">
          <i data-lucide="menu" style="width:22px;height:22px"></i>
        </button>
      </div>
    </div>

    <nav id="mobile-nav" class="hidden sm:hidden flex-col gap-1 px-4 pb-4 border-t border-gray-100 bg-white">
      <a href="catalog.html" data-i18n="navCatalog" class="block text-gray-600 hover:text-brand font-semibold text-sm py-2.5 transition">Каталог</a>
      <a href="about.html" data-i18n="navAbout" class="block text-gray-600 hover:text-brand font-semibold text-sm py-2.5 transition">О бренде</a>
      <a href="contacts.html" data-i18n="navContacts" class="block text-gray-600 hover:text-brand font-semibold text-sm py-2.5 transition">Контакты</a>
    </nav>
  </header>

  <!-- ==================== ХЛЕБНЫЕ КРОШКИ ==================== -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">
    <nav id="breadcrumb" class="flex flex-wrap items-center gap-1.5 text-xs sm:text-sm font-semibold text-gray-400"></nav>
  </div>

  <!-- ==================== КАРТОЧКА ТОВАРА ==================== -->
  <section class="relative overflow-hidden">
    <div class="blob bg-brand/10 w-80 h-80 -top-16 -left-24"></div>
    <div id="product-root" class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12"></div>
  </section>

  <!-- ==================== ПОХОЖИЕ ТОВАРЫ ==================== -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20">
    <h2 data-i18n="relatedTitle" class="text-2xl sm:text-3xl font-extrabold text-brand mb-6">Другие средства линейки</h2>
    <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6"></div>
  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer class="bg-brand text-white rounded-t-[2.5rem] mt-6">
    <div class="max-w-7xl mx-auto px-6 sm:px-8 py-12 sm:py-14">
      <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-8">
        <div>
          <p class="text-2xl font-extrabold mb-2">qqq care.</p>
          <p class="text-sm italic text-white/70 font-medium">quirky qualitative quintessential</p>
        </div>
        <div class="flex flex-col gap-2 text-sm">
          <a href="catalog.html" data-i18n="navCatalog" class="text-white/75 hover:text-white font-semibold transition">Каталог</a>
          <a href="about.html" data-i18n="navAbout" class="text-white/75 hover:text-white font-semibold transition">О бренде</a>
          <a href="contacts.html" data-i18n="navContacts" class="text-white/75 hover:text-white font-semibold transition">Контакты</a>
        </div>
        <div class="flex flex-col gap-2 text-sm">
          <span class="text-white/75 flex items-center gap-2 font-semibold"><i data-lucide="map-pin" style="width:15px;height:15px"></i> <span data-i18n="footerCity">Алматы, Казахстан</span></span>
          <a href="mailto:hello@qqqcare.kz" class="text-white/75 hover:text-white flex items-center gap-2 font-semibold"><i data-lucide="mail" style="width:15px;height:15px"></i> hello@qqqcare.kz</a>
        </div>
      </div>
      <div class="border-t border-white/15 mt-10 pt-6 text-xs text-white/60 font-medium text-center sm:text-left">
        <span id="footer-year"></span>
      </div>
    </div>
  </footer>

  <!-- ==================== КОРЗИНА ==================== -->
  <div id="cart-overlay" class="fixed inset-0 bg-black/40 z-40 transition-opacity duration-300 opacity-0 pointer-events-none"></div>
  <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[440px] bg-white z-50 shadow-2xl flex flex-col transition-transform duration-300 translate-x-full">
    <div class="flex items-center justify-between px-5 sm:px-6 h-16 border-b border-gray-100 flex-shrink-0">
      <h2 id="cart-title" class="font-extrabold text-lg text-brand">Ваша заявка</h2>
      <button id="cart-close" aria-label="Закрыть" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-2 transition">
        <i data-lucide="x" style="width:20px;height:20px"></i>
      </button>
    </div>
    <div id="cart-body" class="flex-1 overflow-y-auto px-5 sm:px-6"></div>
  </aside>

  <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50"></div>

  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedId = Number(params.get('id'));
    const currentProduct = PRODUCTS.find(p => p.id === requestedId) || PRODUCTS[0];
    let selectedQty = 1;
    let activeImgIdx = 0;

    function renderProductPage() {
      const p = currentProduct;
      const pt = getProductText(p);
      const catName = getCategoryName(p.categoryId);
      document.title = `${pt.name} — qqq care.`;

      // Хлебные крошки
      document.getElementById('breadcrumb').innerHTML = `
        <a href="index.html" class="hover:text-brand transition">${t('breadcrumbHome')}</a>
        <i data-lucide="chevron-right" style="width:14px;height:14px"></i>
        <a href="catalog.html" class="hover:text-brand transition">${t('navCatalog')}</a>
        <i data-lucide="chevron-right" style="width:14px;height:14px"></i>
        <span class="text-brand">${pt.name}</span>
      `;

      // Миниатюры фотографий (поддерживает любое количество фото)
      const thumbsHTML = p.images.map((imgUrl, idx) => `
        <button data-thumb-idx="${idx}" class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden border-2 transition ${idx === activeImgIdx ? 'border-brand ring-2 ring-brand/20' : 'border-transparent opacity-70 hover:opacity-100'}">
          <img src="${imgUrl}" alt="${pt.name}" class="w-full h-full object-cover" />
        </button>
      `).join('');

      const priceBlock = SITE_CONFIG.SHOW_PRICES && p.price
        ? `<div class="mb-5"><span class="text-2xl sm:text-3xl font-extrabold text-gray-900">${formatPrice(p.price)}</span></div>`
        : '';

      document.getElementById('product-root').innerHTML = `
        <div class="grid md:grid-cols-2 gap-10 items-start">
          <!-- Галерея фотографий -->
          <div>
            <div class="bg-brand/5 aspect-square rounded-3xl overflow-hidden relative shadow-soft mb-4">
              <span class="absolute top-4 left-4 z-10 bg-white/90 backdrop-blur px-3 py-1.5 rounded-full text-xs font-bold text-brand shadow-sm">${catName}</span>
              <img id="main-product-image" src="${p.images[activeImgIdx]}" alt="${pt.name}" class="w-full h-full object-cover transition-all duration-300" />
            </div>
            <div class="flex flex-wrap gap-3">${thumbsHTML}</div>
          </div>

          <!-- Информация о товаре -->
          <div>
            <span class="text-xs font-extrabold uppercase tracking-widest text-brand/60">${p.code}</span>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-brand leading-snug mt-1 mb-4">${pt.name}</h1>
            ${priceBlock}
            <p class="text-gray-600 font-medium leading-relaxed mb-6">${pt.description}</p>

            <!-- Блок: Для чего / Когда особенно нужен -->
            <div class="mb-5">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-gray-400 mb-2.5">${pt.forWhatTitle}:</h3>
              <div class="flex flex-wrap gap-2">
                ${pt.forWhat.map(item => `
                  <span class="inline-flex items-center gap-1.5 bg-brand/5 text-brand text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full">
                    <i data-lucide="check-circle-2" style="width:15px;height:15px"></i> ${item}
                  </span>
                `).join('')}
              </div>
            </div>

            <!-- Блок: В основе формулы / Ключевые компоненты -->
            <div class="mb-7">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-gray-400 mb-2.5">${pt.formulaTitle}:</h3>
              <div class="flex flex-wrap gap-2">
                ${pt.formula.map(item => `
                  <span class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 text-xs sm:text-sm font-bold px-3.5 py-1.5 rounded-full">
                    <i data-lucide="sparkles" class="text-brand" style="width:14px;height:14px"></i> ${item}
                  </span>
                `).join('')}
              </div>
            </div>

            <!-- Кнопка добавления в заявку -->
            <div class="flex items-center gap-3 mb-7">
              <div class="flex items-center gap-3 border-[1.5px] border-gray-200 rounded-full px-2 py-1.5">
                <button id="qty-dec" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1.5 transition"><i data-lucide="minus" style="width:16px;height:16px"></i></button>
                <span id="qty-value" class="font-extrabold w-5 text-center">${selectedQty}</span>
                <button id="qty-inc" class="text-gray-500 hover:bg-brand/10 hover:text-brand rounded-full p-1.5 transition"><i data-lucide="plus" style="width:16px;height:16px"></i></button>
              </div>

              <button id="add-current-to-cart" class="flex-1 bg-brand text-white py-3.5 px-6 rounded-full font-extrabold text-sm sm:text-base flex items-center justify-center gap-2 hover:bg-brand-light active:scale-95 transition shadow-lg">
                <i data-lucide="shopping-bag" style="width:18px;height:18px"></i>
                <span>${t('btnAddToCart')}</span>
              </button>
            </div>

            <!-- Преимущества -->
            <div class="grid grid-cols-3 gap-2 mb-8">
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="truck" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">${t('feat1')}</span>
              </div>
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="shield-check" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">${t('feat2')}</span>
              </div>
              <div class="flex flex-col items-center text-center gap-1.5 bg-brand/5 rounded-2xl py-3 px-2">
                <i data-lucide="heart-handshake" class="text-brand" style="width:20px;height:20px"></i>
                <span class="text-[11px] font-bold text-gray-600 leading-tight">${t('feat3')}</span>
              </div>
            </div>

            <!-- Аккордеоны -->
            <div class="flex flex-col gap-2">
              <details class="accordion border-b border-gray-100 py-3" open>
                <summary class="flex items-center justify-between font-bold text-brand text-sm">
                  <span>${t('accUsage')}</span>
                  <i data-lucide="chevron-right" class="chevron" style="width:16px;height:16px"></i>
                </summary>
                <p class="text-gray-600 text-sm font-medium mt-3 leading-relaxed">${pt.usage}</p>
              </details>

              <details class="accordion border-b border-gray-100 py-3">
                <summary class="flex items-center justify-between font-bold text-brand text-sm">
                  <span>${t('accDelivery')}</span>
                  <i data-lucide="chevron-right" class="chevron" style="width:16px;height:16px"></i>
                </summary>
                <p class="text-gray-600 text-sm font-medium mt-3 leading-relaxed">${t('accDeliveryText')}</p>
              </details>
            </div>
          </div>
        </div>
      `;

      // Похожие товары
      const related = PRODUCTS.filter(item => item.id !== p.id).slice(0, 4);
      document.getElementById('related-grid').innerHTML = related.map(renderProductCardHTML).join('');
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('click', (e) => {
      const thumbBtn = e.target.closest('[data-thumb-idx]');
      if (thumbBtn) {
        activeImgIdx = Number(thumbBtn.dataset.thumbIdx);
        renderProductPage();
        return;
      }
      if (e.target.closest('#qty-inc')) {
        selectedQty += 1;
        document.getElementById('qty-value').textContent = selectedQty;
        return;
      }
      if (e.target.closest('#qty-dec')) {
        selectedQty = Math.max(1, selectedQty - 1);
        document.getElementById('qty-value').textContent = selectedQty;
        return;
      }
      if (e.target.closest('#add-current-to-cart')) {
        addToCart(currentProduct.id, selectedQty);
        selectedQty = 1;
        document.getElementById('qty-value').textContent = selectedQty;
      }
    });

    window.onPageLangChange = renderProductPage;
    document.addEventListener('DOMContentLoaded', renderProductPage);
  </script>
</body>
</html>
